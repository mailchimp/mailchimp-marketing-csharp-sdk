            <GenerateDocumentationFile>true</GenerateDocumentationFile>
            <NoWarn>$(NoWarn);CS1591</NoWarn>
            <PackageProjectUrl>https://github.com/mailchimp/mailchimp-marketing-csharp-sdk</PackageProjectUrl>
            <RepositoryUrl>https://github.com/mailchimp/mailchimp-marketing-csharp-sdk</RepositoryUrl>
            <RepositoryType>git</RepositoryType>
            <PolySharpIncludeRuntimeSupportedAttributes>true</PolySharpIncludeRuntimeSupportedAttributes>
          </PropertyGroup>

          <PropertyGroup>
            <UsePortableDateOnly>false</UsePortableDateOnly>
          </PropertyGroup>
